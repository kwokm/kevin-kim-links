  .scrim{position:fixed;inset:0;z-index:1;background:
      linear-gradient(180deg,rgba(18,14,11,.70) 0%,rgba(20,16,12,.44) 30%,rgba(16,12,9,.68) 68%,rgba(12,9,7,.90) 100%),
      radial-gradient(ellipse at 50% 12%,rgba(201,168,106,.18) 0%,rgba(0,0,0,0) 58%);}
  main{position:relative;z-index:2;max-width:432px;margin:0 auto;padding:48px 24px 44px;
      display:flex;flex-direction:column;align-items:center;text-align:center;}

  .portrait{position:relative;width:124px;height:124px;margin-bottom:20px;}
  .portrait::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid rgba(201,168,106,.42);}
  .portrait img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 22%;
      border:2px solid rgba(243,236,225,.5);box-shadow:0 18px 44px rgba(0,0,0,.55);display:block;}

  .eyebrow{font-size:9.5px;letter-spacing:4.2px;text-transform:uppercase;color:var(--gold-soft);font-weight:500;margin-bottom:10px;}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:45px;line-height:1;
      letter-spacing:1.5px;margin:0 0 14px;text-shadow:0 2px 24px rgba(0,0,0,.5);}
  .rule{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .rule span{display:block;width:44px;height:1px;background:linear-gradient(90deg,transparent,var(--gold));}
  .rule span:last-child{background:linear-gradient(90deg,var(--gold),transparent);}
  .rule i{width:4px;height:4px;transform:rotate(45deg);background:var(--gold);display:block;}
  .tagline{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:21px;font-weight:300;
      color:#eadfcd;margin-bottom:8px;letter-spacing:.3px;}
  .meta{font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--muted);margin-bottom:28px;}

  .actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
  .act{display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;
      padding:15px 10px;border-radius:14px;font-size:14px;font-weight:500;letter-spacing:1px;transition:.2s;}
  .act svg{width:17px;height:17px;flex:0 0 17px;}
  .act.call{background:var(--gold);color:#1c1204;box-shadow:0 10px 26px rgba(201,168,106,.28);}
  .act.call:hover{background:#dcbb7f;transform:translateY(-2px);}
  .act.text{background:rgba(243,236,225,.10);color:var(--sand);border:1px solid var(--line);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);}
  .act.text:hover{background:rgba(243,236,225,.18);transform:translateY(-2px);}
  .save{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
      padding:14px;border-radius:14px;margin-bottom:26px;font-size:13.5px;letter-spacing:1.4px;
      text-transform:uppercase;color:var(--sand);border:1px dashed rgba(201,168,106,.55);
      background:rgba(28,24,20,.40);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);transition:.2s;}
  .save:hover{border-style:solid;border-color:var(--gold);background:rgba(52,45,37,.62);transform:translateY(-2px);}
  .save svg{width:17px;height:17px;}

  .links{width:100%;display:flex;flex-direction:column;gap:11px;}
  a.link{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--sand);
      background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
      border:1px solid var(--line);border-radius:16px;padding:13px 16px;
      transition:transform .22s cubic-bezier(.2,.7,.3,1),background .22s,border-color .22s,box-shadow .22s;}
  a.link:hover{transform:translateY(-3px);background:var(--glass-hi);border-color:rgba(201,168,106,.55);
      box-shadow:0 14px 34px rgba(0,0,0,.45);}
  a.link:active{transform:translateY(-1px);}
  .logo{flex:0 0 42px;width:42px;height:42px;border-radius:12px;background:#fbf8f3;
      display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);}
  .logo svg{width:23px;height:23px;display:block;}
  .txt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0;}
  .name{font-size:14.5px;font-weight:500;letter-spacing:.4px;}
  .sub{font-size:10.5px;font-weight:300;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);}
  .chev{margin-left:auto;color:var(--gold-soft);opacity:.55;font-size:17px;line-height:1;transition:.22s;}
  a.link:hover .chev{opacity:1;transform:translateX(3px);}

  footer{margin-top:34px;font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;
      color:var(--muted);opacity:.72;line-height:2;}
  footer a{color:var(--gold-soft);text-decoration:none;}
  footer a:hover{text-decoration:underline;}
  @media(max-width:400px){h1{font-size:39px;} .tagline{font-size:19px;}}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
